<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMass Dining Menus &amp; Nutrition</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="hall-theme.css" />
  </head>
  <body>
  <header class="topbar">
    <a class="brand brand-logo" href="index.html" aria-label="Ueat home"><img src="logo.png" alt="Ueat" /></a>
    <nav class="topbar-links" aria-label="Main navigation"><span class="campus-label">UMass Amherst</span><a href="index.html">Meal tracker &nearr;</a></nav>
  </header>
  <section class="hall-hero" id="hallHero" aria-labelledby="hallTitle">
    <div class="hall-photo" id="hallPhoto" aria-hidden="true"></div><div class="hall-shade" aria-hidden="true"></div>
    <div class="hero-content"><p class="eyebrow">Good food. A little more insight.</p><h1 id="hallTitle">Your campus. Your plate.</h1><p class="hero-detail"><span id="hallArea">UMass Amherst dining</span><span>Choose your dining commons below</span></p></div>
    <nav class="hall-tabs" id="hallTabs" aria-label="Dining halls"></nav>
  </section>

    <main class="container">
      <div class="status-bar">
        <span id="menuDate" class="menu-date"></span>
        <span id="statusMsg" class="status-msg" role="status" aria-live="polite"></span>
        <button id="refreshBtn" class="refresh-btn">Refresh</button>
      </div>

      <div class="meal-tabs" id="mealTabs" role="tablist"></div>

      <section id="menu" class="menu"></section>
    </main>

    <!-- Nutrition modal -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="hall-theme.js"></script>
    <script src="app.js"></script>
  </body>
</html>
